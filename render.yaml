services:
  - type: web
    name: fundacion-soy-sistema
    env: node
    plan: free
    buildCommand: npm install && npm run migrate
    startCommand: npm start
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: fundacion-soy-db
          property: connectionString
      - key: SESSION_SECRET
        generateValue: true
      - key: ARCA_AMBIENTE
        value: mock
      - key: ARCA_CBTE_TIPO_DEFAULT
        value: "11"

databases:
  - name: fundacion-soy-db
    plan: free
